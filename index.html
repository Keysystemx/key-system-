<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Key system</title>
<script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:'Plus Jakarta Sans',sans-serif;-webkit-user-select:none;user-select:none}.glass-card{background:linear-gradient(145deg,#181824 0%,#101017 100%);box-shadow:0 25px 50px -12px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.08)}.btn-hover-effect{transition:all .25s cubic-bezier(.4,0,.2,1)}.btn-hover-effect:hover{transform:translateY(-2px);box-shadow:0 12px 25px -5px rgba(99,102,241,.5)}.btn-hover-effect:active{transform:translateY(0) scale(.96)}@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}.animate-fadeIn{animation:fadeIn .3s cubic-bezier(.16,1,.3,1) forwards}</style>
<script>document.addEventListener('contextmenu',e=>e.preventDefault(),false)</script>
</head>
<body class="bg-[#07070a] text-white flex items-center justify-center min-h-screen p-4 selection:bg-indigo-500 selection:text-white" ondragstart="return false;" ondrop="return false;">
<div class="glass-card p-8 rounded-3xl w-full max-w-md text-center border border-[#232338] relative overflow-hidden"><div class="absolute top-0 left-1/2 -translate-x-1/2 w-48 h-1 bg-gradient-to-r from-transparent via-indigo-500 to-transparent animate-pulse"></div>
<div class="flex justify-center mb-4"><div class="p-4 bg-indigo-500/10 border border-indigo-500/30 rounded-2xl text-indigo-400 shadow-inner shadow-indigo-500/20"><svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 00-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg></div></div>
<h1 class="text-2xl font-extrabold tracking-tight text-white mb-1">Key system</h1><p class="text-gray-400 text-xs tracking-widest uppercase mb-6 font-semibold">Z nexus - Key system 2026</p>
<div id="app-container" class="space-y-4 animate-fadeIn"><div class="flex flex-col items-center justify-center py-10 space-y-3"><svg class="animate-spin h-8 w-8 text-indigo-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0h4z"></path></svg><p class="text-gray-400 text-sm font-medium animate-pulse">Verificando integridad en el servidor...</p></div></div>
<div class="mt-8 pt-4 border-t border-[#232338]/60 text-center"><p id="hwid-display" class="text-indigo-400/80 text-[11px] mb-1 font-mono tracking-wide"></p><p class="text-gray-500 text-[10px] tracking-wider uppercase">Z nexus - Key system ₂₀₂₆</p></div></div>
<script type="module">
const container=document.getElementById('app-container'),hwidDisplay=document.getElementById('hwid-display');
const API_BASE='https://keyzsystem.vercel.app',linkRequirements={6:1,12:2,24:3,30:4},SESSION_KEY='znexus_server_session_v4',SESSION_FALLBACK_KEY='znexus_server_session_fallback_v4',ACTIVE_KEY='znexus_active_key',ACTIVE_EXPIRES='znexus_expires_at',ACTIVE_RECORD='znexus_active_record_v2',DEVICE_KEY='znexus_device_id_v1';
let deviceId='',timerInterval=null,validationInterval=null,apiHealthy=false,isGeneratingKey=false,verifyInFlight=false,initDone=false;
function safeErrorMessage(v,f='Error desconocido.'){if(typeof v==='string'&&v.trim())return v;if(v&&typeof v==='object'){if(typeof v.message==='string'&&v.message.trim())return v.message;if(typeof v.error==='string'&&v.error.trim())return v.error;try{return JSON.stringify(v)}catch{}}return f}
async function api(path,o={}){const c=new AbortController(),t=setTimeout(()=>c.abort(),o.timeout||10000);try{const r=await fetch(API_BASE+path,{method:o.method||'GET',body:o.body,signal:c.signal,cache:'no-store',credentials:'omit',headers:{Accept:'application/json',...(o.body?{'Content-Type':'application/json'}:{})}});let d=null;try{d=await r.json()}catch{}if(!r.ok)throw new Error(safeErrorMessage(d?.error||d?.message,`HTTP ${r.status}`));return d||{}}catch(e){if(e.name==='AbortError')throw new Error('TIMEOUT');throw e instanceof Error?e:new Error(safeErrorMessage(e))}finally{clearTimeout(t)}}
async function hwid(){try{const saved=localStorage.getItem(DEVICE_KEY);if(/^HWID-[A-Z0-9]{24}$/.test(saved||''))return saved}catch{}const a=[navigator.hardwareConcurrency||'unknown',navigator.deviceMemory||'unknown',navigator.platform||'unknown',`${screen.width}x${screen.height}x${screen.colorDepth}`,Intl.DateTimeFormat().resolvedOptions().timeZone||'unknown'];try{const x=document.createElement('canvas'),g=x.getContext('webgl')||x.getContext('experimental-webgl'),d=g&&g.getExtension('WEBGL_debug_renderer_info');if(d)a.push(g.getParameter(d.UNMASKED_VENDOR_WEBGL),g.getParameter(d.UNMASKED_RENDERER_WEBGL))}catch{}const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(a.join('|'))),id='HWID-'+Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,24).toUpperCase();try{localStorage.setItem(DEVICE_KEY,id)}catch{}return id}
function getSession(){try{const x=sessionStorage.getItem(SESSION_KEY)||localStorage.getItem(SESSION_FALLBACK_KEY);return x?JSON.parse(x):null}catch{return null}}function setSession(s){const x=JSON.stringify(s);try{sessionStorage.setItem(SESSION_KEY,x);localStorage.setItem(SESSION_FALLBACK_KEY,x)}catch{}}function clearSession(){try{sessionStorage.removeItem(SESSION_KEY);localStorage.removeItem(SESSION_FALLBACK_KEY)}catch{}}
function saveKey(k,exp){try{localStorage.setItem(ACTIVE_KEY,k);localStorage.setItem(ACTIVE_EXPIRES,String(exp));localStorage.setItem(ACTIVE_RECORD,JSON.stringify({key:k,expiresAt:Number(exp),deviceId}))}catch{}}
function readKey(){try{const k=localStorage.getItem(ACTIVE_KEY),e=Number(localStorage.getItem(ACTIVE_EXPIRES)||0),r=JSON.parse(localStorage.getItem(ACTIVE_RECORD)||'null');if(/^ZNEXUS-[A-Z0-9]{9}$/.test(k||'')&&e>Date.now()&&(!r||r.deviceId===deviceId))return{k,exp:e}}catch{}return null}
function clearKey(){try{localStorage.removeItem(ACTIVE_KEY);localStorage.removeItem(ACTIVE_EXPIRES);localStorage.removeItem(ACTIVE_RECORD)}catch{}if(timerInterval)clearTimeout(timerInterval);if(validationInterval)clearInterval(validationInterval);timerInterval=validationInterval=null}
function error(msg,retry=true,action=null,label='Reintentar'){const s=safeErrorMessage(msg).replace(/[<>]/g,'');container.innerHTML=`<div class="bg-red-500/10 border border-red-500/20 p-5 rounded-2xl text-center space-y-3 animate-fadeIn"><p class="text-red-400 text-sm font-bold">${s}</p><button id="err" class="w-full py-3 bg-red-600 hover:bg-red-500 text-white font-bold rounded-xl btn-hover-effect text-sm">${retry?label:'Volver al inicio'}</button></div>`;document.getElementById('err').onclick=()=>{if(action)return action();if(!retry)clearSession();location.href=location.origin}}
function start(){container.innerHTML=`<div class="space-y-4 animate-fadeIn"><p class="text-gray-300 text-sm">Selecciona la duración de tu key.</p><div class="grid grid-cols-2 gap-3">${[6,12,24,30].map(h=>`<button data-h="${h}" class="dur py-3 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-bold btn-hover-effect">${h} horas</button>`).join('')}</div></div>`;document.querySelectorAll('.dur').forEach(b=>b.onclick=()=>begin(Number(b.dataset.h)))}
async function begin(hours){try{container.innerHTML='<div class="py-10 text-indigo-300 animate-pulse">Preparando sesión...</div>';const d=await api('/api/session/start',{method:'POST',body:JSON.stringify({hours,deviceId})});setSession(d.session);progress(d.session)}catch(e){error(e)}}
async function prepare(){try{const s=getSession();if(!s)throw new Error('La sesión ya no está disponible.');if(s.state!=='ready'&&s.state!=='awaiting_external_return')throw new Error('La sesión ya no está lista para este acceso.');const d=await api('/api/session/prepare-link',{method:'POST',body:JSON.stringify({sessionId:s.id,link:s.link,deviceId})});setSession(d.session);location.href=d.redirectUrl}catch(e){error(e)}}
function progress(s){const total=linkRequirements[s.dur];if(s.state==='awaiting_external_return'){container.innerHTML=`<div class="bg-red-500/10 border border-red-500/20 p-5 rounded-2xl text-center space-y-3 animate-fadeIn"><p class="text-red-400 text-sm font-bold">No se recibió el comprobante de Linkvertise.</p><p class="text-gray-400 text-xs leading-relaxed">No voy a reiniciar el acortador automáticamente para evitar un bucle. Regresa al inicio y vuelve a comenzar cuando el enlace esté configurado para regresar a este sitio con <span class="font-mono">?hash=...</span>.</p><button id="restart" class="w-full py-3 bg-red-600 hover:bg-red-500 rounded-xl font-bold btn-hover-effect text-sm">Volver a empezar</button></div>`;document.getElementById('restart').onclick=()=>{clearSession();location.href=location.origin};return}container.innerHTML=`<div class="space-y-4 animate-fadeIn"><p class="text-gray-300 text-sm">Completa los accesos requeridos.</p><p class="text-indigo-300 text-sm font-semibold">Paso ${s.link} de ${total}</p><button id="go" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-bold btn-hover-effect">Continuar</button></div>`;document.getElementById('go').onclick=prepare}
function returnScreen(){container.innerHTML='<div class="space-y-4 animate-fadeIn"><div class="py-8"><svg class="animate-spin h-8 w-8 text-indigo-400 mx-auto mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0h4z"></path></svg><p class="text-gray-300 text-sm font-medium">Confirmando comprobante de Linkvertise...</p><p class="text-gray-500 text-xs mt-2">No cierres esta página.</p></div></div>'}
async function verifyReturn(){if(verifyInFlight)return;const p=new URLSearchParams(location.search),hash=p.get('hash');if(!hash){const s=getSession();if(s&&s.state==='awaiting_external_return')return progress(s);return load()}verifyInFlight=true;returnScreen();try{const s=getSession();if(!s)throw new Error('La sesión ya no está disponible.');if(!/^[A-Za-z0-9]{64}$/.test(hash))throw new Error('El comprobante recibido tiene un formato inválido.');const d=await api('/api/linkvertise/verify',{method:'POST',timeout:15000,body:JSON.stringify({sessionId:s.id,link:s.link,hash,deviceId})});setSession(d.session);history.replaceState({},document.title,location.pathname);if(d.session.state==='complete')await generate();else progress(d.session)}catch(e){error(e,true,()=>{clearSession();location.href=location.origin},'Volver a empezar')}finally{verifyInFlight=false}}
async function load(){const s=getSession();if(!s)return start();try{const d=await api(`/api/session/get?sessionId=${encodeURIComponent(s.id)}&deviceId=${encodeURIComponent(deviceId)}`);setSession(d.session);if(d.session.state==='complete')ready(d.session);else progress(d.session)}catch{clearSession();start()}}
function ready(){container.innerHTML='<div class="space-y-4 animate-fadeIn"><p class="text-green-400 text-sm font-semibold">Todos los pasos fueron completados.</p><button id="gen" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-bold btn-hover-effect">Generar key</button></div>';document.getElementById('gen').onclick=generate}
async function generate(){if(isGeneratingKey)return;isGeneratingKey=true;try{const s=getSession();if(!s)throw new Error('La sesión ya no está disponible.');const d=await api('/api/key/generate',{method:'POST',body:JSON.stringify({sessionId:s.id,deviceId})});clearSession();showKey(d.key,Number(d.expiresAt))}catch(e){error(e,false)}finally{isGeneratingKey=false}}
function showKey(k,exp){if(timerInterval)clearTimeout(timerInterval);if(validationInterval)clearInterval(validationInterval);saveKey(k,exp);container.innerHTML=`<div class="space-y-4 animate-fadeIn"><p class="text-green-400 text-sm font-semibold">Key activa</p><div class="p-4 rounded-xl bg-black/30 border border-indigo-500/30"><p class="text-indigo-300 text-xs mb-2">Tu key</p><p class="font-mono text-lg break-all select-text">${k}</p></div><p id="cd" class="text-gray-400 text-xs"></p></div>`;const tick=()=>{const x=Math.max(0,exp-Date.now());if(!x){clearKey();return error('La key expiró.',false)}const h=Math.floor(x/36e5),m=Math.floor(x%36e5/6e4),s=Math.floor(x%6e4/1e3),cd=document.getElementById('cd');if(cd)cd.textContent=`Expira en ${h}h ${m}m ${s}s`;timerInterval=setTimeout(tick,250)};tick();validationInterval=setInterval(async()=>{try{const d=await api(`/api/key/validate?key=${encodeURIComponent(k)}&deviceId=${encodeURIComponent(deviceId)}`,{timeout:8000});if(!d.valid){clearKey();error('La key ya no es válida o fue revocada.',false)}}catch{}},30000)}
async function restoreActiveKey(){const cached=readKey();if(!cached)return false;try{const d=await api(`/api/key/validate?key=${encodeURIComponent(cached.k)}&deviceId=${encodeURIComponent(deviceId)}`,{timeout:8000});if(d.valid){showKey(cached.k,Number(d.expiresAt||cached.exp));return true}clearKey();return false}catch{showKey(cached.k,cached.exp);return true}}
async function init(){try{deviceId=await hwid();hwidDisplay.textContent='Device ID: '+deviceId;const p=new URLSearchParams(location.search);if(p.has('hash')){await verifyReturn();apiHealthy=true;initDone=true;return}const h=await api('/api/health',{timeout:7000});if(!h.ok)throw new Error('API no disponible');apiHealthy=true;if(await restoreActiveKey()){initDone=true;return}await load();initDone=true}catch(e){apiHealthy=false;initDone=true;error(e)}}
window.addEventListener('pageshow',async()=>{if(!initDone||!apiHealthy||new URLSearchParams(location.search).has('hash')||isGeneratingKey||verifyInFlight)return;await restoreActiveKey()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){const cached=readKey();if(cached)showKey(cached.k,cached.exp)}});
init();
</script></body></html>
